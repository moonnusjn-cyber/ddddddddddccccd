<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق كاشير العدوي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f172a; padding: 4px; direction: rtl; text-align: right; color: #1e293b; font-size: 11px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-frame { width: 100%; max-width: 420px; background: #f8fafc; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 95vh; border: 4px solid #334155; }
        .app-header { background: #1e3a8a; color: white; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; }
        .app-header h1 { font-size: 13px; margin: 0; font-weight: bold; }
        .header-info { font-size: 10px; background: #3b82f6; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .app-body { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
        .section-card { background: white; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; }
        .search-box { width: 100%; padding: 7px; border: 2px solid #cbd5e1; border-radius: 6px; font-size: 11px; outline: none; margin-bottom: 6px; }
        .categories { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 6px; padding-bottom: 2px; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { padding: 5px 10px; border: none; background: #e2e8f0; color: #1e293b; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: #2563eb; color: white; }
        .products-grid { overflow-y: auto; max-height: 160px; border: 1px solid #e2e8f0; padding: 4px; background: #fff; border-radius: 6px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .product-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 5px; text-align: center; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; height: 70px; }
        .product-title { font-weight: bold; color: #0f172a; display: block; font-size: 9px; height: 22px; overflow: hidden; }
        .product-price { font-weight: bold; color: #16a34a; font-size: 10px; display: block; }
        .product-stock { font-size: 8px; color: #64748b; background: #f1f5f9; padding: 1px; border-radius: 3px; }
        .top-inputs { display: flex; gap: 4px; margin-bottom: 6px; }
        .top-inputs input { flex: 1; padding: 6px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 10px; outline: none; }
        .cart-table-wrapper { max-height: 120px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 6px; }
        .cart-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 10px; }
        .cart-table th { background: #f1f5f9; padding: 5px; border-bottom: 2px solid #cbd5e1; position: sticky; top: 0; }
        .cart-table td { padding: 4px 2px; border-bottom: 1px solid #f1f5f9; }
        .qty-btn { width: 20px; height: 20px; border: none; background: #cbd5e1; font-weight: bold; border-radius: 3px; cursor: pointer; }
        .del-btn { color: #dc2626; cursor: pointer; font-weight: bold; font-size: 11px; background: #fee2e2; padding: 1px 5px; border-radius: 3px; }
        .summary-box { background: #f8fafc; border: 1px solid #cbd5e1; padding: 6px; border-radius: 6px; }
        .summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 10px; font-weight: bold; }
        .summary-row input { width: 80px; padding: 4px; text-align: center; border: 2px solid #2563eb; border-radius: 4px; font-weight: bold; font-size: 11px; outline: none; }
        .action-btns { display: flex; gap: 4px; margin-top: 4px; }
        .btn-action { flex: 1; padding: 7px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; font-size: 10px; text-align: center; }
        .btn-print { background: #16a34a; }
        .btn-reset { background: #dc2626; }
        .btn-history { background: #d97706; }
        .btn-stock { background: #4f46e5; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 12px; border-radius: 8px; width: 90%; max-width: 380px; max-height: 70vh; overflow-y: auto; text-align: right; }
        .close-btn { cursor: pointer; font-weight: bold; color: white; background: #dc2626; padding: 3px 8px; border-radius: 4px; float: left; font-size: 10px; }
    </style>
</head>
<body>
    <div class="app-frame">
        <div class="app-header">
            <h1>🛒 كاشير العدوي</h1>
            <div style="display:flex; gap:4px;">
                <div class="header-info" id="clock">--:--</div>
                <div class="header-info" id="invoice-badge">#1001</div>
            </div>
        </div>
        <div class="app-body">
            <div class="section-card">
                <div class="top-inputs">
                    <input type="text" id="cashier-name" placeholder="👨‍💼 البائع">
                    <input type="text" id="cust-name" placeholder="👤 العميل">
                </div>
                <div class="cart-table-wrapper">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th style="text-align:right;">الصنف</th>
                                <th>السعر</th>
                                <th>العدد</th>
                                <th>الإجمالي</th>
                                <th>حذف</th>
                            </tr>
                        </thead>
                        <tbody id="cart-rows"></tbody>
                    </table>
                </div>
                <div class="summary-box">
                    <div class="summary-row">
                        <span>الإجمالي:</span>
                        <span id="grand-total" style="color:#2563eb; font-size:12px;">0 ج</span>
                    </div>
                    <div class="summary-row">
                        <span>المدفوع:</span>
                        <input type="number" id="paid-amount" placeholder="0" onkeyup="calculateChange()">
                    </div>
                    <div class="summary-row">
                        <span>الباقي:</span>
                        <span id="change-amount" style="color:#16a34a; font-size:12px;">0 ج</span>
                    </div>
                    <div class="action-btns">
                        <button class="btn-action btn-print" onclick="saveAndPrintInvoice()">🖨️ طباعة</button>
                        <button class="btn-action btn-reset" onclick="resetCart()">🗑️ جديد</button>
                    </div>
                    <div class="action-btns" style="margin-top:3px;">
                        <button class="btn-action btn-stock" onclick="loadAndShowInvoices(); showInvoicesModal();" style="background-color: #d97706;">📜 الفواتير</button>
                        <button class="btn-action btn-stock" onclick="showStockReport()">📦 المخزن</button>
                    </div>
                </div>
            </div>
            <div class="section-card">
                <input type="text" id="search" class="search-box" placeholder="🔍 ابحث في المنتجات..." onkeyup="filterProducts()">
                <div class="categories">
                    <button class="cat-btn active" onclick="setCategory('الكل', this)">الكل</button>
                    <button class="cat-btn" onclick="setCategory('بقالة', this)">بقالة</button>
                    <button class="cat-btn" onclick="setCategory('ألبان وجبن', this)">ألبان</button>
                    <button class="cat-btn" onclick="setCategory('مشروبات', this)">مشروبات</button>
                    <button class="cat-btn" onclick="setCategory('منظفات', this)">منظفات</button>
                    <button class="cat-btn" onclick="setCategory('حلويات', this)">حلويات</button>
                    <button class="cat-btn" onclick="setCategory('عطارة', this)">عطارة</button>
                </div>
                <div class="products-grid" id="grid"></div>
            </div>
        </div>
    </div>
    <div id="modal-box" class="modal">

        </div>
    </div>

            ];
            for (var i = 0; i < base.length; i++) {
                products.push({ name: base[i].n, price: base[i].p, qty: 100, cat: base[i].c });
            }
        }
        initProducts();

        function renderProducts(list) {
            var grid = document.getElementById('grid');
            if (!grid) return;
            grid.innerHTML = '';
            for (var i = 0; i < list.length; i++) {
                var p = list[i];
                var card = document.createElement('div');
                card.className = 'product-card';
                card.setAttribute('onclick', 'addToCart("' + p.name + '")');
                card.innerHTML = '<span class="product-title">' + p.name + '</span>' +
                                 '<span class="product-price">' + p.price + ' ج</span>' +
                                 '<div class="product-stock">المتاح: ' + p.qty + '</div>';
                grid.appendChild(card);
            }
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            var btns = document.getElementsByClassName('cat-btn');
            for (var i = 0; i < btns.length; i++) { btns[i].className = 'cat-btn'; }
            btn.className = 'cat-btn active';
            filterProducts();
        }

        function filterProducts() {
            var q = document.getElementById('search').value.toLowerCase();
            var filtered = [];
            for (var i = 0; i < products.length; i++) {
                var p = products[i];
                var matchCat = (currentCategory === "الكل" || p.cat === currentCategory);
                var matchName = (q === '' || p.name.toLowerCase().indexOf(q) !== -1);
                if (matchCat && matchName) { filtered.push(p); }
            }
            renderProducts(filtered);
        }

        function addToCart(name) {
            var prod = null;
            for (var i = 0; i < products.length; i++) {
                if (products[i].name === name) { prod = products[i]; break; }
            }
            if (!prod || prod.qty <= 0) return;
            var inCart = null;
            for (var j = 0; j < cart.length; j++) {
                if (cart[j].name === name) { inCart = cart[j]; break; }
            }
            if (inCart) { inCart.qty++; } else { cart.push({ name: prod.name, price: prod.price, qty: 1 }); }
            updateCartUI();
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) { cart.splice(index, 1); }
            updateCartUI();
        }

        function updateCartUI() {
            var tbody = document.getElementById('cart-rows');
            tbody.innerHTML = '';
            var total = 0;
            for (var i = 0; i < cart.length; i++) {
                var item = cart[i];
                var itemTotal = item.price * item.qty;
                total += itemTotal;
                var tr = document.createElement('tr');
                tr.innerHTML = '<td style="text-align:right; font-weight:bold;">' + item.name + '</td>' +
                    '<td>' + item.price + '</td>' +
                    '<td><button class="qty-btn" onclick="changeQty(' + i + ', -1)">-</button> <b>' + item.qty + '</b> <button class="qty-btn" onclick="changeQty(' + i + ', 1)">+</button></td>' +
                    '<td style="font-weight:bold; color:#2563eb;">' + itemTotal + '</td>' +
                    '<td><span class="del-btn" onclick="changeQty(' + i + ', -' + item.qty + ')">✕</span></td>';
                tbody.appendChild(tr);
            }
            document.getElementById('grand-total').innerHTML = total + " ج";
            calculateChange();
        }

        function calculateChange() {
            var total = parseFloat(document.getElementById('grand-total').innerHTML) || 0;
            var paid = parseFloat(document.getElementById('paid-amount').value) || 0;
            var changeEl = document.getElementById('change-amount');
            var change = paid - total;
            if (change >= 0) {
                changeEl.innerHTML = change + " ج";
                changeEl.style.color = "#16a34a";
            } else {
                changeEl.innerHTML = "ناقص " + Math.abs(change) + " ج";
                changeEl.style.color = "#dc2626";
            }
        }

        function resetCart() {
            cart = [];
            document.getElementById('paid-amount').value = '';
            updateCartUI();
        }

        function completeAndPrint() {
            if (cart.length === 0) { alert("السلة فارغة!"); return; }
            alert("تم حفظ وطباعة الفاتورة بنجاح!");
            resetCart();
        }

        function showModal(title, bodyHtml) {
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-box').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-box').style.display = 'none';
        }

       // دالة حفظ وعرض الفاتورة
function saveAndPrintInvoice() {
    let invoices = JSON.parse(localStorage.getItem('saved_invoices')) || [];
    
    // تأكد إن سلة المنتجات مش فاضية قبل الحفظ
    if (typeof cart !== 'undefined' && cart.length > 0) {
        let newInvoice = {
            id: document.getElementById('invoice-id') ? document.getElementById('invoice-id').innerText : "1001",
            date: new Date().toLocaleString(),
            items: [...cart],
            total: typeof totalAmount !== 'undefined' ? totalAmount : 0
        };
        
        invoices.push(newInvoice);
        localStorage.setItem('saved_invoices', JSON.stringify(invoices));
    }
    
    window.print(); // تنفيذ الطباعة
}

        function showStockReport() {
            var html = '<table style="width:100%; border-collapse:collapse; text-align:center; font-size:10px;"><thead><tr style="background:#f1f5f9;"><th style="text-align:right;">الصنف</th><th>السعر</th><th>المتبقي</th></tr></thead><tbody>';
            for (var i = 0; i < products.length; i++) {
                html += '<tr style="border-bottom:1px solid #e2e8f0;"><td style="text-align:right;">' + products[i].name + '</td><td>' + products[i].price + ' ج</td><td><b>' + products[i].qty + '</b></td></tr>';
            }
            html += '</tbody></table>';
            showModal("جرد المخزن", html);
        }

        filterProducts();
    </script>
</body>
